<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stock Market Prediction</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <h1 class="text-3xl font-bold text-center mb-5">Live Stock Market Prediction</h1>

        <div class="mb-5 flex justify-center">
            <input id="stockSymbol" type="text" placeholder="Enter Stock Symbol (e.g., AAPL)" 
                   class="p-2 border border-gray-400 rounded-l-md">
            <button onclick="fetchStockData()" 
                    class="p-2 bg-blue-500 text-white rounded-r-md hover:bg-blue-600">
                Get Prediction
            </button>
        </div>

        <div id="stockData" class="text-center text-xl text-gray-700">
            Enter a stock symbol to see live data and predictions.
        </div>
    </div>

    <script>
        async function fetchStockData() {
            const symbol = document.getElementById('stockSymbol').value.toUpperCase();
            if (!symbol) {
                alert("Please enter a stock symbol.");
                return;
            }

            try {
                const response = await axios.get('https://finnhub.io/api/v1/quote?symbol=${symbol}&token=d0i1rrhr01qji78r6sm0d0i1rrhr01qji78r6smg');
                const data = response.data;
                
                if (data.c) {
                    document.getElementById('stockData').innerHTML = `
                        <p>Current Price: $${data.c}</p>
                        <p>High Price of the Day: $${data.h}</p>
                        <p>Low Price of the Day: $${data.l}</p>
                        <p>Previous Close Price: $${data.pc}</p>
                    `;
                } else {
                    document.getElementById('stockData').innerHTML = "Stock symbol not found.";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('stockData').innerHTML = "Error fetching stock data.";
            }
        }
    </script>
</body>
</html>
